<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="./main.js"></script>
  <title>COSMOBANK Terminal – Simulyatsiya</title>
  <style>
    :root{
      --bg:#0b1220;           /* Asosiy fon */
      --panel:#0f1b33;        /* Panel foni */
      --border:#1e335c;       /* Panel chegarasi */
      --txt:#e6eef7;          /* Oq rang */
      --green:#2de36a;
      --yellow:#ffd166;
      --red:#ff5a5f;
      --cyan:#4fd1ff;
      --muted:#9fb3c8;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:radial-gradient(1200px 600px at 70% 10%,rgba(79,209,255,.12),transparent 60%), var(--bg);
      color:var(--txt);
      font:14px/1.5 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      letter-spacing:.2px;
      overflow:hidden;
    }
    .screen{height:100%; display:flex; flex-direction:column;}
    .topbar{padding:10px 14px; color:var(--cyan); border-bottom:1px solid var(--border); background:rgba(14,24,44,.6);}
    .title{white-space:pre;}
    .grid{flex:1; display:grid; grid-template-columns: 1.2fr .8fr; gap:12px; padding:12px;}
    .panel{background:var(--panel); border:1px solid var(--border); border-radius:14px; display:flex; flex-direction:column; box-shadow:0 10px 30px rgba(0,0,0,.25) inset;}
    .panel h3{margin:0; padding:10px 12px; color:var(--cyan); border-bottom:1px solid var(--border); font-weight:600; letter-spacing:1px;}
    .panel-body{padding:10px 12px; flex:1; overflow:auto;}

    /* Loglar */
    .log{display:flex; gap:8px; opacity:.95}
    .log + .log{margin-top:6px}
    .stamp{color:var(--muted)}
    .c-green{color:var(--green)}
    .c-yellow{color:var(--yellow)}
    .c-red{color:var(--red)}
    .c-cyan{color:var(--cyan)}
    .c-white{color:var(--txt)}

    /* Status jadvali */
    .status{display:grid; grid-template-columns:1fr auto; row-gap:6px; column-gap:10px;}
    .key{color:var(--muted)}
    .badge{padding:2px 8px; border-radius:999px; border:1px solid var(--border); background:rgba(255,255,255,.03); font-weight:600}

    /* Progress */
    .progress-wrap{padding:0 12px 14px;}
    .progress-label{display:flex; justify-content:space-between; margin:8px 0 6px; color:var(--muted)}
    .bar{height:10px; border-radius:999px; background:#0a152a; border:1px solid var(--border); overflow:hidden}
    .bar > i{display:block; height:100%; width:0%; background:linear-gradient(90deg, var(--cyan), var(--green)); transition:width .08s linear}

    /* Pastdagi info */
    .footer{border-top:1px dashed var(--border); padding:8px 12px; color:var(--muted); font-size:12px}

    /* Yakuniy ekran */
    .terminated{position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:radial-gradient(600px 300px at 50% 30%, rgba(255,90,95,.06), transparent 60%), var(--bg);}
    .terminated h1{color:var(--red); font-size:28px; letter-spacing:4px; text-align:center}

    /* Tugma (ixtiyoriy restart) */
    .actions{position:fixed; bottom:10px; right:12px; display:flex; gap:8px}
    button{background:transparent; border:1px solid var(--border); color:var(--txt); padding:8px 12px; border-radius:10px; cursor:pointer}
    button:hover{border-color:var(--cyan)}

    /* Scroll bar nozik ko'rinish */
    ::-webkit-scrollbar{height:8px;width:10px}
    ::-webkit-scrollbar-thumb{background:#1a2a4a;border-radius:10px}
    ::-webkit-scrollbar-track{background:transparent}

    @media (max-width:920px){
      .grid{grid-template-columns:1fr;}
    }
  </style>
</head>
<body>
  <!-- Yuqori panel -->
  <div class="screen" id="screen">
    <div class="topbar"><span class="title" id="title">>>> C O S M O B A N K   T E R M I N A L <<<</span></div>

    <div class="grid">
      <!-- Log monitor -->
      <section class="panel">
        <h3>LOG MONITOR</h3>
        <div class="panel-body" id="logs"></div>
        <div class="progress-wrap">
          <div class="progress-label">
            <span>JARAYON</span>
            <span id="pcent">0%</span>
          </div>
          <div class="bar"><i id="bar"></i></div>
        </div>
        <div class="footer">DIQQAT: Bu simulyatsiya 100% xavfsiz va faqat vizual maqsadlar uchun.</div>
      </section>

      <!-- Status panel -->
      <section class="panel">
        <h3>STATUS</h3>
        <div class="panel-body">
          <div class="status" id="status"></div>
        </div>
        <div class="footer">COSMOBANK SYS • v1.0 • Demo</div>
      </section>
    </div>
  </div>

  <!-- Yakuniy ekran -->
  <div class="terminated" id="terminated">
    <h1>CONNECTION TERMINATED</h1>
  </div>

  <!-- Harakatlar -->
  <div class="actions">
    <button id="restart">Restart</button>
  </div>

<script>
// =======================
//  COSMOBANK SIMULYATSIYA
// =======================

// Ranglar uchun CSS klasslari
const COLORS = { green:'c-green', yellow:'c-yellow', red:'c-red', cyan:'c-cyan', white:'c-white' };

// Statuslar
const statusKeys = [
  'Network Link',
  'Firewall Breach',
  'Admin Access',
  'Vault Access',
  'Trace Scramble'
];

const startStatus = {
  'Network Link': {text:'[PENDING]', cls: COLORS.white},
  'Firewall Breach': {text:'[WAITING]', cls: COLORS.white},
  'Admin Access': {text:'[WAITING]', cls: COLORS.white},
  'Vault Access': {text:'[WAITING]', cls: COLORS.white},
  'Trace Scramble': {text:'[ACTIVE]', cls: COLORS.cyan}
};

// DOM elementlar
const logsEl = document.getElementById('logs');
const statusEl = document.getElementById('status');
const barEl = document.getElementById('bar');
const pcentEl = document.getElementById('pcent');
const terminatedEl = document.getElementById('terminated');
const restartBtn = document.getElementById('restart');
const titleEl = document.getElementById('title');

let logs = [];
let status = {};

function nowStamp(){
  const d = new Date();
  return d.toLocaleTimeString();
}

function renderLogs(){
  logsEl.innerHTML = logs.map(item => `
    <div class="log">
      <span class="stamp">[${item.time}]</span>
      <span class="${item.cls}">${item.text}</span>
    </div>`
  ).join('');
  logsEl.scrollTop = logsEl.scrollHeight;
}

function addLog(text, cls = COLORS.white){
  logs.push({ time: nowStamp(), text, cls });
  if(logs.length > 10) logs = logs.slice(-10);
  renderLogs();
}

function renderStatus(){
  statusEl.innerHTML = statusKeys.map(key => {
    const s = status[key] || {text:'', cls:COLORS.white};
    return `<div class="key">${key}</div><div class="badge ${s.cls}">${s.text}</div>`;
  }).join('');
}

function updateStatus(key, text, cls = COLORS.yellow){
  status[key] = { text, cls };
  renderStatus();
}

function setProgress(p){
  const clamped = Math.max(0, Math.min(100, p|0));
  barEl.style.width = clamped + '%';
  pcentEl.textContent = clamped + '%';
}

// Progress animatsiyasi
function animatedProgress(durationSec, message){
  addLog(message, COLORS.cyan);
  return new Promise(resolve => {
    const start = performance.now();
    function tick(t){
      const p = Math.min(100, ((t - start) / (durationSec * 1000)) * 100);
      setProgress(p);
      if(p < 100) requestAnimationFrame(tick); else resolve();
    }
    requestAnimationFrame(tick);
  });
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

async function typeTitle(text){
  titleEl.textContent = '';
  for(const ch of text){
    titleEl.textContent += ch;
    await sleep(50);
  }
}

async function massTransfer(){
  let total = 0;
  // 200 marta inkrement – vizual effekt
  for(let i=0;i<200;i++){
    const inc = Math.floor(Math.random()*9900000)+100000; // 100k–9.9M
    total += inc;
    addLog(`TRANSFER: $${total.toLocaleString('en-US')}`, COLORS.yellow);
    await sleep(20);
  }
  addLog(`Total $${total.toLocaleString('en-US')} transferred.`, COLORS.green);
}

async function wipeCountdown(){
  for(let i=10;i>=0;i--){
    addLog(`System logs will be wiped in ${i}...`, COLORS.yellow);
    await sleep(500);
  }
}

async function runScenario(){
  // Boshlang'ich holat
  logs = [];
  status = JSON.parse(JSON.stringify(startStatus));
  renderLogs();
  renderStatus();
  setProgress(0);
  terminatedEl.style.display = 'none';

  // 1. Sarlavha typing
  await typeTitle('>>> C O S M O B A N K   T E R M I N A L <<<');
  await sleep(1200);

  // 2. Hujum bosqichlari (simulyatsiya)
  addLog('Initializing Quantum Link...', COLORS.cyan);
  await sleep(1200);

  await animatedProgress(3, 'Bypassing GNB-Firewall v7.2...');
  updateStatus('Network Link', '[CONNECTED]', COLORS.green);
  updateStatus('Firewall Breach', '[IN PROGRESS]', COLORS.yellow);
  addLog('Firewall bypassed. Root access granted.', COLORS.green);
  await sleep(600);

  await animatedProgress(4, 'Decrypting admin credentials...');
  updateStatus('Firewall Breach', '[SUCCESS]', COLORS.green);
  updateStatus('Admin Access', '[IN PROGRESS]', COLORS.yellow);
  addLog('Admin credentials decrypted.', COLORS.green);
  addLog("Login: 'SYS_ADMIN_ROOT'", COLORS.white);
  addLog("Password: '****************'", COLORS.white);
  await sleep(600);

  await animatedProgress(3, 'Accessing main financial vault...');
  updateStatus('Admin Access', '[GRANTED]', COLORS.green);
  updateStatus('Vault Access', '[IN PROGRESS]', COLORS.yellow);
  addLog('Vault access confirmed. Money transfer module enabled.', COLORS.green);
  await sleep(600);

  // 3. Kulminatsiya: pul o'tkazish
  updateStatus('Vault Access', '[ACTIVE]', COLORS.green);
  addLog('Initiating mass fund transfer!', COLORS.red);
  await sleep(300);
  await massTransfer();
  await sleep(800);

  // 4. Izlarni yo'qotish
  addLog('WARNING: Covering tracks!', COLORS.red);
  updateStatus('Trace Scramble', '[EXECUTING]', COLORS.red);
  await sleep(600);
  await wipeCountdown();

  // 5. Yakuniy ekran
  document.getElementById('screen').style.opacity = 0;
  await sleep(200);
  terminatedEl.style.display = 'flex';
  await sleep(1800);
  document.getElementById('screen').style.opacity = 1; // keyingi restart uchun
}

restartBtn.addEventListener('click', () => {
  // Qayta ishga tushirish
  runScenario();
});

// Avto-boshlanish
runScenario();
</script>
</body>
</html>
